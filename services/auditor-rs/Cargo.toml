[package]
name = "auditor"
version = "0.1.0"
edition = "2021"
default-run = "auditor"

[lib]
name = "auditor"
path = "src/lib.rs"

[[bin]]
name = "auditor"
path = "src/main.rs"

[[bin]]
name = "roundtrip-check"
path = "src/bin/roundtrip-check.rs"

[[bin]]
name = "test-analyzers"
path = "src/bin/test-analyzers.rs"

[[bin]]
name = "test-etherscan"
path = "src/bin/test-etherscan.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy = { version = "0.5", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = "0.12"
